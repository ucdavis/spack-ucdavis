packages:

  all:
    target: [x86_64_v3]
    providers:
      tbb:
      - intel-oneapi-tbb
      fftw-api:
      - fftw
      mkl:
      - intel-oneapi-mkl
      mpi:
      - openmpi
      - mpich
      mysql-client:
      - mariadb
    variants:
    - cuda_arch=75,86
    #deprecation:
    #  allow:
    #  - severity: medium

  cairo:
    require: +X +ft +fc +pdf +png +gobject

  cuda:
    version:
      - '12.6.2'
    require: +allow-unsupported-compilers

  dbus:
    require: '@1.13.6 system-socket=/var/run/dbus/system_bus_socket'

  environment-modules:
    variants: etcdir=/etc/environment-modules

  gettext:
    require: +libxml2

  # When mpi=openmpi, this introduces an unresolvable dependency.
  # See https://github.com/spack/spack/issues/15836 for details
  hwloc:
    require: +pci +libxml2 +libudev +nvml +cuda +cairo

  mpich:
    require: 'netmod=ucx pmi=pmix romio-filesystem=nfs,quobytefs +romio +verbs +fortran +cuda ^pmix@5.0.3'

  mysql-client:
    require:
    - spec: mariadb
      message: 'mysql-client: require system-installed mariadb'

  #mysql@5.6.44:
  #  require: ^openssl@1.0.2u

  openmpi:
    require:
      - spec: '+atomics fabrics=ucx schedulers=slurm +cuda'
        message: 'openmpi: always enforce these variants'
        when: '@:'
      - spec: '+legacylaunchers'
        message: 'openmpi: legacylaunchers for versions @:4'
        when: '@:4'
      - spec: 'romio-filesystem=nfs,quobytefs ^pmix@5.0.3' # Make sure pmix version matches openmpi's internal pmix version
        when: '@5:'
        message: 'openmpi: romio-filesystem variants for @5:'

  slurm:
    require: '+pmix +mariadb +hwloc +restd +nvml +cgroup +pam +lua sysconfdir=/etc/slurm ^pmix@5.0.3'

  sqlite:
    variants: +rtree

  squashfs:
    variants: +gzip +lz4 +lzo +xz +zstd

  tar:
    require:
    - spec: '%gcc'
      message: 'tar: does not build properly with OneAPI'

  tbb:
    require:
    - spec: intel-oneapi-tbb
      message: 'tbb: require intel-oneapi-tbb provider'

  ucx:
    require: '+cma +dc +dm ~gdrcopy +ib_hw_tm +mlx5_dv +openmp +optimizations +rc +rdmacm +thread_multiple +ucg +ud +verbs'

  #xmlto:
  #  require:
  #  - spec: '%gcc'
  #    message: 'xmlto: does not build properly with OneAPI'
