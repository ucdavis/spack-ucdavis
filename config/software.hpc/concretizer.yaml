concretizer:
  # Whether to consider installed packages or packages from buildcaches when
  # concretizing specs. If `true`, we'll try to use as many installs/binaries
  # as possible, rather than building. If `false`, we'll always give you a fresh
  # concretization.
  reuse: true
  # Options that tune which targets are considered for concretization. The
  # concretization process is very sensitive to the number targets, and the time
  # needed to reach a solution increases noticeably with the number of targets
  # considered.
  targets:
    # Determine whether we want to target specific or generic microarchitectures.
    # An example of the first kind might be for instance "skylake" or "bulldozer",
    # while generic microarchitectures are for instance "aarch64" or "x86_64_v4".
    granularity: microarchitectures
    # If "false" allow targets that are incompatible with the current host (for
    # instance concretize with target "icelake" while running on "haswell").
    # If "true" only allow targets that are compatible with the host.
    host_compatible: false
  # When "true" concretize root specs of environments together, so that each unique
  # package in an environment corresponds to one concrete spec. This ensures
  # environments can always be activated. When "false" perform concretization separately
  # on each root spec, allowing different versions and variants of the same package in
  # an environment.
  unify: when_possible
  # A list keeps mixing disabled except for the named packages: everything that links into an
  # nvhpc/oneapi root must use that compiler unless it is listed here. The exemption covers only
  # the named node, not its dependencies, so a library's whole link/run closure has to be listed.
  # Three groups:
  #  1. System externals built with gcc@11.4.0 (packages.external.yaml): apptainer, julia,
  #     mariadb, mariadb-c-client, mesa, munge, openssl, rust.
  #  2. Plain-C libraries in the MPI stacks' link closures, built once with %gcc_default via
  #     environments/software.hpc/common/packages.gcc-libs.yaml (numactl, libnl, libxcrypt,
  #     gettext and their closures). Rules for adding one: C-only ABI (no Fortran modules, no C++
  #     API used by the HPC stack), not on the performance/OpenMP path, and every link/run
  #     dependency listed too. Keep each entry in both files.
  #  3. Build tools the solver would otherwise build per vendor compiler (perl, cmake, python ...);
  #     the exemption is a safety net in case one becomes a run dependency of a vendor root.
  # Not listed, on purpose: openmpi, mpich, ucx, hwloc, pmix, prrte, libevent, yaksa, and in main
  # hdf5, netcdf, fftw, openblas, scalapack (Fortran modules, C++ or performance).
  compiler_mixing:
  - apptainer
  - autoconf
  - automake
  - bzip2
  - cmake
  - curl
  - diffutils
  - expat
  - file
  - gdbm
  - gettext
  - julia
  - krb5
  - less
  - libbsd
  - libedit
  - libffi
  - libiconv
  - libmd
  - libnl
  - libpciaccess
  - libtool
  - libxcrypt
  - libxml2
  - mariadb
  - mariadb-c-client
  - mesa
  - munge
  - ncurses
  - nghttp2
  - numactl
  - openssh
  - openssl
  - perl
  - pigz
  - py-cython
  - python
  - rdma-core
  - readline
  - rust
  - sqlite
  - tar
  - util-linux-uuid
  - xz
  - zlib-ng
  - zstd
