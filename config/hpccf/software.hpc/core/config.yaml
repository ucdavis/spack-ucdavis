config:
  install_tree:
    root: /cvmfs/hpc.ucdavis.edu/sw/spack/core
  build_stage:
    - /dev/shm/spack-tmp/$user/spack-stage
    - $user_cache_path/stage
  source_cache: $user_cache_path/core/source
  template_dirs:
  - /cvmfs/hpc.ucdavis.edu/sw/spack/spack-ucdavis/templates
  db_lock_timeout: 60
  deprecated: true
  extensions:
  - /cvmfs/hpc.ucdavis.edu/sw/spack/spack-manager
