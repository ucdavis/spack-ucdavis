packages:

  ####
  # Externals: non-buildable
  ####

  mariadb:
    externals:
    - spec: mariadb@10.8.2 %gcc
      prefix: /usr
    buildable: false

  munge:
    externals:
    - spec: munge@0.5.14 %gcc
      prefix: /usr
    buildable: false

  apptainer:
    externals:
    - spec: apptainer@1.3.4
      prefix: /user
    buildable: false

  ####
  # Externals: buildable
  ####

  mariadb-c-client:
    externals:
    - spec: mariadb-c-client@3 %gcc
      prefix: /usr

  ####
  #
  # Core stack and libraries
  #
  ####
  #

  nvhpc:
    require: '+blas +lapack +mpi'

  cuda:
    require: '+allow-unsupported-compilers'

  rust:
    require: '+dev'
      
  slurm:
    require: '+pmix +mariadb +hwloc +restd +nvml +cgroup +pam sysconfdir=/etc/slurm arch=linux-ubuntu22.04-x86_64_v3'

  ucx:
    require: '+thread_multiple'
  
  openmpi:
    require: 
      - spec: '+atomics fabrics=ucx schedulers=slurm +cuda cuda_arch=75,86'
        message: 'openmpi: always enforce these variants'
        when: '@:'
      - spec: '+legacylaunchers'
        message: 'openmpi: legacylaunchers for versions @:4'
        when: '@:4'
      - spec: 'romio-filesystem=nfs,quobytefs'
        when: '@5:'
        message: 'openmpi: romio-filesystem variants for @5:'

  mpich:
    require: 'netmod=ucx pmi=pmix +cuda cuda_arch=75,86'

  environment-modules:
    variants: etcdir=/etc/environment-modules

  # When mpi=openmpi, this introduces an unresolvable dependency.
  # See https://github.com/spack/spack/issues/15836 for details
  hwloc:
    require: '+pci +libxml2 +libudev +nvml +cuda +cairo cuda_arch=75,86'

  #mkl:
  #  require:
  #    - spec: intel-oneapi-mkl
  #      message: 'mkl: require intel-oneapi-mkl'

  #mpi:
  #  require: 
  #    - one_of:
  #      - openmpi
  #      - mpich

  ####
  #
  # Other package / build tree constraints
  #
  ####

  cairo:
    require: +X +ft +fc +pdf +png +gobject

  dbus:
    require: '@1.13.6 system-socket=/var/run/dbus/system_bus_socket'

  gettext:
    require: +libxml2

  mysql@5.6.44:
    require: ^openssl@1.0.2u

  sqlite:
    variants: +rtree

  mysql-client:
    require:
      - spec: mariadb
        message: 'mysql-client: require system-installed mariadb'

  tbb:
    require:
      - spec: intel-oneapi-tbb
        message: 'tbb: require intel-oneapi-tbb provider'

  # xmlto does not build properly with OneAPI
  xmlto:
    require:
      - spec: '%gcc'
        message: 'xmlto: does not build properly with OneAPI'

  squashfs:
    variants: +gzip +lz4 +lzo +xz +zstd

  tar:
    require:
      - spec: '%gcc'
        message: 'tar: does not build properly with OneAPI'

  ####

  all:
    target: [x86_64_v3]
    compiler:
    - gcc @13.2.0
    providers:
      tbb:
        - intel-oneapi-tbb
      fftw-api:
        - fftw
      mkl:
        - intel-oneapi-mkl
      mpi:
        - openmpi
        - mpich
      mysql-client:
        - mariadb
    variants:
    - cuda_arch=75,86

