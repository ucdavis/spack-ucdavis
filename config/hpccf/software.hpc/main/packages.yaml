  # Other package / build tree constraints
  #
  ####
  cairo:
    require: +X +ft +fc +pdf +png +gobject
  dbus:
    require: '@1.13.6 system-socket=/var/run/dbus/system_bus_socket'
  gettext:
    require: +libxml2
  sqlite:
    variants: +rtree
  tbb:
    require:
      - spec: intel-oneapi-tbb
        message: 'tbb: require oneapi tbb'
