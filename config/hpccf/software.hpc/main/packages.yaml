      - spec: '+atomics fabrics=ucx schedulers=slurm +cuda cuda_arch=75,86'
        message: 'openmpi: always enforce these variants'
        when: '@:'
      - spec: '+legacylaunchers'
        message: 'openmpi: legacylaunchers for versions @:4'
        when: '@:4'
      - spec: 'romio-filesystem=nfs,quobytefs'
        when: '@5:'
        message: 'openmpi: romio-filesystem variants for @5:'
  ucx:
    externals:
      - spec: ucx@1.17.0~assertions~backtrace_detail~cma~cuda~dc~debug~dm+examples~gdrcopy~gtest~ib_hw_tm~java~knem~logging~mlx5_dv+openmp+optimizations~parameter_checking+pic~rc~rdmacm~rocm+thread_multiple~ucg~ud~verbs~vfs~xpmem libs=shared,static opt=3 simd=auto target=x86_64_v3
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/generic/ucx-1.17.0
      - spec: ucx@1.17.0~assertions~backtrace_detail~cma~cuda~dc~debug~dm+examples~gdrcopy~gtest~ib_hw_tm~java~knem~logging~mlx5_dv+openmp+optimizations~parameter_checking+pic~rc~rdmacm~rocm+thread_multiple~ucg~ud~verbs~vfs~xpmem libs=shared,static opt=3 simd=auto target=zen2
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/zen2/ucx-1.17.0
      - spec: ucx@1.17.0~assertions~backtrace_detail~cma~cuda~dc~debug~dm+examples~gdrcopy~gtest~ib_hw_tm~java~knem~logging~mlx5_dv+openmp+optimizations~parameter_checking+pic~rc~rdmacm~rocm+thread_multiple~ucg~ud~verbs~vfs~xpmem libs=shared,static opt=3 simd=auto target=zen3
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/zen3/ucx-1.17.0
    buildable: false
    require: '+thread_multiple'
  pmix:
    externals:
      - spec: pmix@4.2.9 target=x86_64_v3
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/generic/pmix-4.2.9
      - spec: pmix@4.2.9 target=zen2
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/zen2/pmix-4.2.9
      - spec: pmix@4.2.9 target=zen3
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/zen3/pmix-4.2.9
      - spec: pmix@5.0.3 target=x86_64_v3
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/generic/pmix-5.0.3
      - spec: pmix@5.0.3 target=zen2
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/zen2/pmix-5.0.3
      - spec: pmix@5.0.3 target=zen3
        prefix: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core/view/zen3/pmix-5.0.3
    buildable: false
