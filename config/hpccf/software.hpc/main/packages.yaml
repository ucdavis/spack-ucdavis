  mariadb:
    externals:
      - spec: mariadb@10.8.2 %gcc
        prefix: /usr
    buildable: false
  munge:
    externals:
      - spec: munge@0.5.14 %gcc
        prefix: /usr
    buildable: false
  ####
  # Externals: buildable
  ####
  mariadb-c-client:
    externals:
      - spec: mariadb-c-client@3 %gcc
        prefix: /usr
