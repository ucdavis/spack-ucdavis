spack:
  include:
  - /cvmfs/hpc.ucdavis.edu/sw/spack/env/compilers/definitions.yaml
  - /cvmfs/hpc.ucdavis.edu/sw/spack/env/core/definitions.yaml
  - libs.yaml
  - utils.yaml
  - general.yaml
  - perl.yaml
  - cryoem.yaml
  include_concrete:
  - /cvmfs/hpc.ucdavis.edu/sw/spack/env/compilers
  - /cvmfs/hpc.ucdavis.edu/sw/spack/env/core
  specs:
  # splatted specs, see definitions
  - $compiler-pkgs
  - $generic-specs
  - $cuda-specs
  - $messaging-specs
  #- $cryoem-specs

    #- matrix:
    #  - [$utils-specs]
    #  - [$default-target]

    #- matrix:
    #  - [$general-pkgs]
    #  - [$default-target]
    #- $general-specs

    #- matrix:
    #  - [$perl-specs]
    #  - [$default-target]

  - matrix:
    - [$libs-specs]
    - [$compilers]

  #packages:
  #  aocc: {buildable: False}
  #  gcc: {buildable: False}
  #  intel-oneapi-compilers: {buildable: False}
  #  intel-oneapi-compilers-classic: {buildable: False}
  #  llvm: {buildable: False}
  #  nvhpc: {buildable: False}
  #  mpich: {buildable: False}
  #  openmpi: {buildable: False}
  #  pmix: {buildable: False}
  #  libevent: {buildable: False}
  #  ucx: {buildable: False}
  #  #environment-modules: {buildable: False}
  #  slurm: {buildable: False}
  #  hwloc: {buildable: False}
  #  go: {buildable: False}
  #  julia: {buildable: False}
  #  rust: {buildable: False}
  #  cuda: {buildable: False}
  #  jdk: {buildable: False}
  #  openjdk: {buildable: False}
  view:
    default:
      root: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/main/view
      exclude:
      #- llvm
      - repeatmasker # short term fix: repeatmasker is downloading giant DB files
      projections:
        "target=x86_64_v3 %oneapi": oneapi/{name}-{version}
        "target=x86_64_v3 %intel": intel/{name}-{version}
        target=x86_64_v3: generic/{name}-{version}
        target=zen2: zen2/{name}-{version}
        target=zen3: zen3/{name}-{version}
      link: roots
      link_type: symlink
  modules:
    prefix_inspections:
      lib64:
      - LD_LIBRARY_PATH
      - LIBRARY_PATH
      lib:
      - LD_LIBRARY_PATH
      - LIBRARY_PATH
      include:
      - CPATH
      - C_INCLUDE_PATH
      - CPLUS_INCLUDE_PATH
    view_relative_modules:
      use_view: true
    default:
      use_view: true
      roots:
        tcl: /cvmfs/hpc.ucdavis.edu/sw/spack/modulefiles/main
      tcl:
        all:
          autoload: run
          suffixes:
            '%oneapi': '%oneapi@{compiler.version}'
            '%intel': '%icc@{compiler.version}'
            '%gcc@7.5': '%gcc@{compiler.version}'
            '%gcc@9.5': '%gcc@{compiler.version}'
            '%gcc@13.4': '%gcc@{compiler.version}'
            '%gcc@15.1': '%gcc@{compiler.version}'
            '%aocc': '%aocc@{compiler.version}'
            '%nvhpc': '%nvhpc@{compiler.version}'
            '%clang': '%clang@{compiler.version}'
        #hide_implicits: false
        defaults:
        - cuda @12.6.2
        - '%gcc@11.4.0'
        exclude:
        - mariadb
        - environment-modules
        projections:
          aocc: lang/aocc/{version}
          gcc: lang/gcc/{version}
          intel-oneapi-compilers: lang/oneapi/{version}
          intel-oneapi-compilers-classic: lang/icc/{version}
          llvm: lang/clang/{version}
          nvhpc: lang/nvhpc/{version}
          go: lang/go/{version}
          jdk: lang/jdk/{version}
          openjdk: lang/openjdk/{version}
          julia: lang/julia/{version}
          perl: lang/perl/{version}
          rust: lang/rust/{version}
          cuda: lang/cuda/{version}
          mpich: core/{name}/{version}
          openmpi: core/{name}/{version}
          pmix: core/{name}/{version}
          libevent: core/{name}/{version}
          ucx: core/{name}/{version}
          slurm: core/{name}/{version}
          hwloc: core/{name}/{version}
          py-quast: general/quast/{version}
          py-alphafold: general/alphafold/{version}
          py-htseq: general/htseq/{version}
          py-multiqc: general/multiqc/{version}
          apptainer: general/apptainer/latest
          all: general/{name}/{version}
        rstudio:
          template: hpccf/rstudio.tcl
        perl:
          template: hpccf/perl.tcl
        h5z-zfp:
          environment:
            prepend_path:
              HDF5_PLUGIN_PATH: '{prefix}/plugin'
        root:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib/root'
              LIBRARY_PATH: '{prefix}/lib/root'
        slurm:
          environment:
            set:
              SQUEUE_FORMAT2: 'JobID:10,UserName:16 ,Partition:14 ,Name:20 ,StateCompact:4,TimeLeft:13,NumCPUs:6,NumNodes:6,tres-per-node:14,ReasonList'
  concretizer:
    unify: false
    reuse: true
