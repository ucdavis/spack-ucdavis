spack:
  include:
  - definitions.yaml
  specs:
  - matrix:
    - [$compilers-to-build]
    - ['%gcc_bootstrap']
  view:
    default:
      root: $spack/../env/compilers/view
      projections:
        gcc: '{name}-{version}'
        llvm: clang-{version}
      link: roots
      link_type: hardlink
  modules:
    default:
      'enable:': []
  concretizer:
    unify: false
    reuse: false
  packages:
    llvm:
      buildable: true
    gcc:
      buildable: true
