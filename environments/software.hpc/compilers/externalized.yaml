packages:
  gcc:
    externals:
      - spec: gcc@7.5.0 target=x86_64_v3
        prefix: $spack/../env/compilers/view/gcc-7.5.0
        extra_attributes:
          compilers:
            c: $spack/../env/compilers/view/gcc-7.5.0/bin/gcc
            cxx: $spack/../env/compilers/view/gcc-7.5.0/bin/g++
            fortran: $spack/../env/compilers/view/gcc-7.5.0/bin/gfortran
          environment:
            set:
              CUDAFLAGS: "--allow-unsupported-compiler"
      - spec: gcc@13.5.0 target=x86_64_v3
        prefix: $spack/../env/compilers/view/gcc-13.5.0
        extra_attributes:
          compilers:
            c: $spack/../env/compilers/view/gcc-13.5.0/bin/gcc
            cxx: $spack/../env/compilers/view/gcc-13.5.0/bin/g++
            fortran: $spack/../env/compilers/view/gcc-13.5.0/bin/gfortran
          environment:
            set:
              CUDAFLAGS: "--allow-unsupported-compiler"
      - spec: gcc@15.3.0 target=x86_64_v3
        prefix: $spack/../env/compilers/view/gcc-15.3.0
        extra_attributes:
          compilers:
            c: $spack/../env/compilers/view/gcc-15.3.0/bin/gcc
            cxx: $spack/../env/compilers/view/gcc-15.3.0/bin/g++
            fortran: $spack/../env/compilers/view/gcc-15.3.0/bin/gfortran
          environment:
            set:
              CUDAFLAGS: "--allow-unsupported-compiler"
  llvm:
    externals:
      - spec: llvm@14.0.6+clang+flang~cuda target=x86_64_v3
        prefix: $spack/../env/compilers/view/clang-14.0.6
        extra_attributes:
          compilers:
            c: $spack/../env/compilers/view/clang-14.0.6/bin/clang
            cxx: $spack/../env/compilers/view/clang-14.0.6/bin/clang++
            fortran: $spack/../env/compilers/view/clang-14.0.6/bin/flang
      - spec: llvm@16.0.6 +clang+flang~cuda target=x86_64_v3
        prefix: $spack/../env/compilers/view/clang-16.0.6
        extra_attributes:
          compilers:
            c: $spack/../env/compilers/view/clang-16.0.6/bin/clang
            cxx: $spack/../env/compilers/view/clang-16.0.6/bin/clang++
            fortran: $spack/../env/compilers/view/clang-16.0.6/bin/flang
      - spec: llvm@19.1.3+clang+flang~cuda target=x86_64_v3
        prefix: $spack/../env/compilers/view/clang-19.1.3
        extra_attributes:
          compilers:
            c: $spack/../env/compilers/view/clang-19.1.3/bin/clang
            cxx: $spack/../env/compilers/view/clang-19.1.3/bin/clang++
            fortran: $spack/../env/compilers/view/clang-19.1.3/bin/flang
      - spec: llvm@25.1.2+clang+flang~cuda target=x86_64_v3
        prefix: $spack/../env/compilers/view/clang-25.1.2
        extra_attributes:
          compilers:
            c: $spack/../env/compilers/view/clang-25.1.2/bin/clang
            cxx: $spack/../env/compilers/view/clang-25.1.2/bin/clang++
            fortran: $spack/../env/compilers/view/clang-25.1.2/bin/flang