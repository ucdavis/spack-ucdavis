spack:
  include:
  - definitions.yaml
  - ../compilers/externalized.yaml
  specs:
  - $core-specs
  #- group: core
  #  specs:
  #  - $core-specs
  view:
    default:
      root: $spack/../env/core/view
      projections:
        all: "{architecture.platform}-{architecture.target}/{compiler.name}-{compiler.version}/{name}-{version}"
      link: roots
      link_type: hardlink
  concretizer:
    unify: when_possible
    reuse: false
  modules:
    default:
      enable:: []
