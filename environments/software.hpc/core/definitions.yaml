  definitions:
    - compilers:
      - '%gcc_default'
      - '%oneapi_default'
      - '%nvhpc_default'

    # ^cuda@13.0.2 on each package whose DAG contains cuda: with unify: when_possible every
    # solve round holds a single cuda root and the MPI stacks land in different rounds, so
    # without the pin each stack links a different cuda (ucx 1.22 then fails against
    # cuda@:11.6). pmix and libevent have no cuda dependency and must stay unpinned.
    - messaging-pkgs:
      - mpich @4.3.2 ^pmix@5.0.10 ^cuda@13.0.2
      - openmpi @5.0.10 ^pmix@5.0.10 ^cuda@13.0.2
      #- openmpi @4.1.5
      - openmpi @4.1.7 ^cuda@13.0.2
      - pmix @4.2.9
      - pmix @5.0.10
      #- pmix @5.0.8
      - libevent @2.1.12
      - ucx @1.17.0 ^cuda@13.0.2
      - hwloc @2.11.1 ^cuda@13.0.2

    - generic-pkgs:
      - environment-modules @5.7.0
      - tcl
      - slurm @26-05-4-1 ^pmix@5.0.10
      - go @1.23.2
      - go @1.27.1
      - jdk @23.0.1
      - openjdk @11.0.17_8
      - openjdk @16.0.2
      - openjdk @17.0.11_9
      - openjdk @25.0.2_10
    - generic-specs:
      - matrix:
        - [$generic-pkgs]
        - ['%gcc_default']

    - cuda-versions:
      - '@13.3.0'
      - '@13.0.2'
      - '@12.6.2'
      - '@12.3.0'
      - '@11.7'
      - '@11.2.2'
      - '@10.2.89'
      - '@9.2.88'
      - '@8.0.61'
    - cuda-specs:
      - matrix:
        - [cuda]
        - [$cuda-versions]
        - ['%gcc_default']

    - messaging-specs:
      - matrix:
        - [$messaging-pkgs]
        - [$compilers]

    - core-specs:
      - $messaging-specs
      - $cuda-specs
      - $generic-specs

