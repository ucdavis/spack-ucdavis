  definitions:
    - compilers:
      - '%gcc_default'
      - '%oneapi_default'

    - messaging-pkgs:
      - mpich @4.3.0
      - openmpi @4.1.8
      - openmpi @5.0.8
      - pmix @4.2.9
      - pmix @5.0.3 # DEPRECATE
      - pmix @5.0.8
      - libevent @2.1.12
      - ucx @1.17.0 # DEPRECATE
      - ucx @1.18.1

    - generic-pkgs:
      - environment-modules @5.5.0
      - tcl
      - slurm @25-05-0-1
      - hwloc @2.11.1
      - go @1.23.2
      - rust @1.85.0
      - rust @1.81.0
      - jdk @23.0.1
      - openjdk @11.0.17_8
      - openjdk @16.0.2
      - openjdk @17.0.11_9
    - generic-specs:
      - matrix:
        - [$generic-pkgs]
        - ['%gcc_default']

    - cuda-versions:
      - '@12.9.0'
      - '@12.6.2'
      - '@12.3.0'
      - '@11.7'
      - '@11.2.2'
      - '@10.2.89'
      - '@9.2.88'
      - '@8.0.61'
    - cuda-specs:
      - matrix:
        - [cuda]
        - [$cuda-versions]

    - messaging-specs:
      - matrix:
        - [$messaging-pkgs]
        - [$compilers]

    - core-specs:
      - $messaging-specs
      - $cuda-specs
      - $generic-specs

