  definitions:
    - messaging-pkgs:
      - mpich @4.2.1
      - openmpi @4.1.5
      - openmpi @4.1.7
      - openmpi @5.0.5
      - pmix @4.2.9
      - pmix @5.0.3
      #- pmix @5.0.8
      - libevent @2.1.12
      - ucx @1.17.0
    - generic-pkgs:
      - environment-modules @5.5.0
      - tcl
      - slurm @25-05-0-1
      - hwloc @2.11.1
      - go @1.23.2
      - jdk @23.0.1
      - openjdk @11.0.17_8
      - openjdk @16.0.2
      - openjdk @17.0.11_9
    - cuda-versions:
      - '@12.6.2'
      - '@12.3.0'
      - '@11.7'
      - '@11.2.2'
      - '@10.2.89'
      - '@9.2.88'
      - '@8.0.61'
    - openssl-versions:
      - '@1.0.2u'
      - '@1.1.1w'
      - '@3.0.15'
      - '@3.1.7'
      - '@3.2.3'
      - '@3.4.0'
    - targets:
      - '%gcc@=13.2.0 arch=linux-ubuntu22.04-x86_64_v3'
      - '%oneapi@=2025.0.0 arch=linux-ubuntu22.04-x86_64_v3'
      - '%gcc@=13.2.0 arch=linux-ubuntu22.04-zen2'
      - '%gcc@=13.2.0  arch=linux-ubuntu22.04-zen3'
      #- '%oneapi arch=linux-ubuntu22.04-skylake_avx512'
    - generic-specs:
      - matrix:
        - [$generic-pkgs]
        - ['%gcc@=13.2.0 arch=linux-ubuntu22.04-x86_64_v3']
    - cuda-specs:
      - matrix:
        - [cuda]
        - [$cuda-versions]
        - ['%gcc@=13.2.0 arch=linux-ubuntu22.04-x86_64_v3']
    - messaging-specs:
      - matrix:
        - [$messaging-pkgs]
        - [$targets]
        #- ['%gcc@=13.2.0']
    - openssl-specs:
      - matrix:
        - [openssl]
        - [$openssl-versions]
        - [$targets]
        #- ['%gcc@=13.2.0']
