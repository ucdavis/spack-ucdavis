  definitions:
    - messaging-pkgs:
      - mpich @4.3.0
      #- openmpi @4.1.5
      - openmpi @4.1.7
      - openmpi @5.0.8
      - pmix @4.2.9
      - pmix @5.0.3 # DEPRECATE
      - pmix @5.0.8
      - libevent @2.1.12
      - ucx @1.17.0 # DEPRECATE
      - ucx @1.18.1
    - generic-pkgs:
      - environment-modules @5.5.0
      - tcl
      - slurm @25-05-0-1
      - hwloc @2.11.1
      - go @1.23.2
      - rust @1.85.0
      - rust @1.81.0
      #- rust @1.78.0
    - julia-versions:
      - '@1.11.5'
    - cuda-versions:
      - '@12.9.0'
      - '@12.6.2'
      - '@12.3.0'
      - '@11.7'
      - '@11.2.2'
      - '@10.2.89'
      - '@9.2.88'
      - '@8.0.61'
    - default-target:
      - '%gcc@=11.4.0 arch=linux-ubuntu22.04-x86_64_v3'
    - targets:
      - $default-target
      - '%oneapi@=2025.2.1 arch=linux-ubuntu22.04-x86_64_v3'
      #- '%gcc@=11.4.0 arch=linux-ubuntu22.04-zen2'
      #- '%gcc@=11.4.0  arch=linux-ubuntu22.04-zen3'
      #- '%oneapi arch=linux-ubuntu22.04-skylake_avx512'
    - generic-specs:
      - jdk @23.0.1
      - openjdk @11.0.17_8
      - openjdk @16.0.2
      - openjdk @17.0.11_9
      - matrix:
        - [$generic-pkgs]
        - [$default-target]
    - julia-specs:
      - matrix:
        - [julia]
        - [$julia-versions]
        - ['^curl@8.11.1 %gcc@=11.4.0 arch=linux-ubuntu22.04-x86_64_v3']
    - cuda-specs:
      - matrix:
        - [cuda]
        - [$cuda-versions]
        - [$default-target]
    - messaging-specs:
      - matrix:
        - [$messaging-pkgs]
        - [$targets]
    #- openssl-specs:
    #  - matrix:
    #    - [openssl]
    #    - [$openssl-versions]
    #    - [$targets]
