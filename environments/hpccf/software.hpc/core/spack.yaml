spack:
  include:
  - definitions.yaml
  specs:
  - $core-specs
  view:
    default:
      root: /cvmfs/hpc.ucdavis.edu/sw/spack/env/core/view
      projections:
        slurm: generic/slurm
        tcl: generic/{name}-{version}
        environment-modules: generic/environment-modules
        "target=x86_64_v3 %oneapi": oneapi-{compiler.version}/{name}-{version}
        target=x86_64_v3: generic/{name}-{version}
        target=zen2: zen2/{name}-{version}
        target=zen3: zen3/{name}-{version}
      link: roots
      link_type: hardlink
  concretizer:
    unify: when_possible
    reuse: false
  #packages:
  #  gcc:
  #    buildable: False
  modules:
    default:
      enable:: []
