spack:
  include:
  - definitions.yaml
  # add package specs to the `specs` list
  specs:
  - $generic-specs
  - $cuda-specs
  - $messaging-specs
  #- hpl@2.3 %gcc@13.2.0 ^openmpi@5.0.5 ^openblas threads=openmp 
  #- hpl@2.3 %gcc@13.2.0 ^mpich@4.2.1 ^openblas threads=openmp 
  #- intel-mpi-benchmarks @2021.7 %gcc@13.2.0 ^openmpi@5.0.5 
  #- intel-mpi-benchmarks @2021.7 %gcc@13.2.0 ^mpich@4.2.1
  #- hpl@2.3 %aocc@5.0.0 ^openmpi@5.0.5 ^openblas threads=openmp 
  #- hpl@2.3 %aocc@5.0.0 ^mpich@4.2.1 ^openblas threads=openmp 
  view:
    default:
      root: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/core-dev/view
      projections:
        hpl: bench/{compiler.name}-{compiler.version}/{^mpi.name}-{^mpi.version}/{name}-{version}
        intel-mpi-benchmarks: bench/{compiler.name}-{compiler.version}/{^mpi.name}-{^mpi.version}/{name}-{version}
        slurm: generic/slurm
        tcl: generic/{name}-{version}
        environment-modules: generic/environment-modules
        "target=x86_64_v3 %oneapi": oneapi/{name}-{version}
        target=x86_64_v3: generic/{name}-{version}
        target=zen2: zen2/{name}-{version}
        target=zen3: zen3/{name}-{version}
      link: roots
      link_type: hardlink
  concretizer:
    unify: false
    reuse: false
  packages:
    hcoll::
      externals:
      - spec: hcoll@4.8.3230 %gcc@11
        prefix: /cvmfs/hpc.ucdavis.edu/sw/nvidia/hcoll/4.8.3230
          #extra_attributes:
          #  environment:
          #    prepend_path:
          #      LD_LIBRARY_PATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/hcoll/4.8.3230/lib
          #      LIBRARY_PATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/hcoll/4.8.3230/lib
          #      CPATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/hcoll/4.8.3230/include
          #      PKG_CONFIG_PATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/hcoll/4.8.3230/pkgconfig
      buildable: False
    hwloc::
      require: +pci +libxml2 +libudev +nvml +cuda +cairo cuda_arch=75,86
    mpich::
      require: ~hydra ~hcoll +xpmem +vci device=ch4 netmod=ucx pmi=pmix +fortran +romio +slurm +verbs +cuda cuda_arch=75,86
    openmpi::
      require:
      - spec: +atomics +openshmem +rsh fabrics=cma,hcoll,ofi,ucc,ucx,verbs schedulers=slurm +cuda cuda_arch=75,86
        message: 'openmpi: always enforce these variants'
        when: '@:'
      - spec: +legacylaunchers +pmi
        message: 'openmpi: legacylaunchers for versions @:4'
        when: '@:4'
      - spec: romio-filesystem=nfs,quobytefs +romio ldflags="-Wl,--allow-shlib-undefined" ^pmix@5.0.3
        when: '@5:'
        message: 'openmpi: romio-filesystem variants for @5:'
    slurm::
      require: +pmix +mariadb +hwloc +restd +nvml +cgroup +pam sysconfdir=/etc/slurm
        #ucc::
        #  require: +cuda cuda_arch=75,86
        #  externals:
        #  - spec: ucc @1.4.0 +cuda cuda_arch=75,86
        #    prefix: /cvmfs/hpc.ucdavis.edu/sw/nvidia/ucc/1.4.0
        #    extra_attributes:
        #      environment:
        #        prepend_path:
        #          LD_LIBRARY_PATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/ucc/1.4.0/lib
        #          LIBRARY_PATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/ucc/1.4.0/lib
        #          CPATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/ucc/1.4.0/include
        #          PKG_CONFIG_PATH: /cvmfs/hpc.ucdavis.edu/sw/nvidia/ucc/1.4.0/pkgconfig
        #  buildable: False
    ucx::
      require: +cma +dc +dm ~gdrcopy +ib_hw_tm +mlx5_dv +openmp +optimizations +rc +rdmacm +thread_multiple +ucg +ud +verbs
