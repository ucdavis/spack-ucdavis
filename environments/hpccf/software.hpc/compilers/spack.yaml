spack:
  include:
  - definitions.yaml
  specs:
  - $compiler-pkgs
  view:
    default:
      root: /cvmfs/hpc.ucdavis.edu/sw/spack/env/compilers/view
      projections:
        gcc: '{name}-{version}'
        aocc: '{name}-{version}'
        intel-oneapi-compilers: '{name}-{version}'
        intel-oneapi-compilers-classic: '{name}-{version}'
        nvhpc: '{name}-{version}'
        llvm: 'clang-{version}'
      link: roots
      link_type: copy
  modules:
    default:
      enable:: []
  concretizer:
    unify: false
    reuse: false

