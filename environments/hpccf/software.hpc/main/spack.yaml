spack:
  include:
  - ../core/definitions.yaml
  - libs.yaml
  - utils.yaml
  - general.yaml
  specs:
  # splatted specs, see definitions
  - $compilers
  - $generic-specs
  - $cuda-specs
  - $messaging-specs
  - $openssl-specs
  - matrix:
    - [$utils-specs]
    - [arch=linux-ubuntu22.04-x86_64_v3]
  - matrix:
    - [$general-specs]
    - [arch=linux-ubuntu22.04-x86_64_v3]
  - matrix:
    - [$libs-specs]
    - [$targets]
  view:
    default:
      root: /cvmfs/hpc.ucdavis.edu/sw/spack/environments/main/view
      exclude:
      - llvm
      - repeatmasker # short term fix: repeatmasker is downloading giant DB files
      projections:
        target=x86_64_v3: generic/{name}-{version}
        target=zen2: zen2/{name}-{version}
        target=zen3: zen3/{name}-{version}
        #target=skylake_avx512: 'skylake_avx512/{name}-{version}'
      link: roots
      link_type: symlink
  modules:
    prefix_inspections:
      lib64:
      - LD_LIBRARY_PATH
      lib:
      - LD_LIBRARY_PATH
      include:
      - CPATH
      - C_INCLUDE_PATH
      - CPLUS_INCLUDE_PATH
    view_relative_modules:
      use_view: true
    default:
      use_view: true
      roots:
        tcl: /cvmfs/hpc.ucdavis.edu/sw/spack/modulefiles/main
      tcl:
        all:
          autoload: run
        #hide_implicits: false
        defaults:
        - cuda @12.3
        #include:
        #- $generic-specs
        exclude:
        - mariadb
        - environment-modules
        projections:
          intel-oneapi-compilers: oneapi/{version}
          llvm: clang/{version}
          py-quast: quast/{version}
          py-alphafold: alphafold/{version}
          py-htseq: htseq/{version}
          py-multiqc: multiqc/{version}
        # Template overrides
        rstudio:
          template: hpccf/rstudio.tcl

  concretizer:
    unify: false
